services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: latium_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-latium_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-latium_password}
      POSTGRES_DB: ${POSTGRES_DB:-latium_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - latium_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-latium_user} -d ${POSTGRES_DB:-latium_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: latium_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes
    volumes:
      - latium_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: latin_class-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: latium_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8001}:8000"
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-latium-ai-dev-secret-key-super-secure-token-signing-key-minimum-32-bytes}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-latium_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-latium_password}
      - POSTGRES_DB=${POSTGRES_DB:-latium_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-latium_user}:${POSTGRES_PASSWORD:-latium_password}@postgres:5432/${POSTGRES_DB:-latium_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000","http://localhost:8001"]
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: latium_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    image: latin_class-frontend:latest
    environment:
      - VITE_API_URL=/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  latium_postgres_data:
    external: true
  latium_redis_data:
    external: true

